[package]
name = "leptos-webcomponent-macro"
version = "1.2.0"
edition = "2021"
description = "Proc macro that turns Leptos components into standards-compliant web components (part of leptos-webcomponent)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Samujalphukan228/wc-bridge"
keywords = ["leptos", "web-components", "custom-elements", "wasm", "proc-macro"]
categories = ["web-programming", "wasm"]
rust-version = "1.70"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
convert_case = "0.6"
