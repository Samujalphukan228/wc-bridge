[package]
name = "leptos-webcomponent"
version = "1.2.0"
edition = "2021"
description = "Leptos components as standards-compliant web components with one shared contract (kebab-case attrs in, CustomEvents out, shared CSS vars)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Samujalphukan228/wc-bridge"
keywords = ["leptos", "web-components", "custom-elements", "wasm"]
categories = ["web-programming", "wasm"]
rust-version = "1.70"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos-webcomponent-macro = { version = "1.2.0", path = "../leptos-webcomponent-macro" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlElement", "CustomEvent", "CustomEventInit", "EventTarget"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
