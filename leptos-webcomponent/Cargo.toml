[package]
name = "leptos-webcomponent"
version = "1.0.0"
edition = "2021"
description = "Leptos components as standards-compliant web components with one shared contract (kebab-case attrs in, CustomEvents out, shared CSS vars)."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/example/wc-bridge"
keywords = ["leptos", "web-components", "custom-elements", "wasm"]
categories = ["web-programming", "wasm"]
rust-version = "1.70"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos-webcomponent-macro = { path = "../leptos-webcomponent-macro" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlElement"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
